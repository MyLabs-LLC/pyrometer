[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrometer"
dynamic = ["version"]
description = "Performance monitoring for hosts and SQL Server, from MyLabs LLC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "MyLabs LLC" }]
keywords = ["monitoring", "performance", "metrics", "sql server", "psutil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
sqlserver = ["pyodbc>=5.0"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "types-psutil"]

[project.scripts]
pyrometer = "pyrometer.cli:main"

[project.urls]
Homepage = "https://github.com/MyLabs-LLC/pyrometer"
Issues = "https://github.com/MyLabs-LLC/pyrometer/issues"

[tool.hatch.version]
path = "src/pyrometer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrometer"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml", "pyodbc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
